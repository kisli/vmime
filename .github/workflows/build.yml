name: Compilation test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - name: install-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils cmake doxygen g++ libcppunit-dev libgnutls28-dev libgsasl-dev libgtk-3-dev libssl-dev make pkg-config
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: buildall
      run: |
        set -ex
        cmake . -DVMIME_SENDMAIL_PATH:STRING="/usr/sbin/sendmail" -DVMIME_HAVE_TLS_SUPPORT:BOOL=ON -DVMIME_BUILD_TESTS=ON -DVMIME_BUILD_SAMPLES=ON
        make "-j$(nproc)"
        sudo make install
        make test
