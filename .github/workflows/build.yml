name: Compilation test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    name: build-linux (${{ matrix.tls }}, ${{ matrix.charset }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        tls: [ gnutls, openssl ]
        charset: [ icu, iconv ]
    steps:
    - name: install-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils cmake doxygen g++ libcppunit-dev libgnutls28-dev libgsasl-dev libgtk-3-dev libicu-dev libssl-dev make pkg-config
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: buildall
      run: |
        set -ex
        cmake . -DVMIME_SENDMAIL_PATH:STRING="/usr/sbin/sendmail" -DVMIME_HAVE_TLS_SUPPORT:BOOL=ON -DVMIME_TLS_SUPPORT_LIB:STRING=${{ matrix.tls }} -DVMIME_CHARSETCONV_LIB:STRING=${{ matrix.charset }} -DVMIME_BUILD_TESTS=ON -DVMIME_BUILD_SAMPLES=ON
        make "-j$(nproc)"
        sudo make install
        make test

  build-linux-sanitizers:
    name: build-linux-sanitizers (asan, ubsan)
    runs-on: ubuntu-26.04
    steps:
    - name: install-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake g++ libcppunit-dev libgnutls28-dev libgsasl-dev libicu-dev make pkg-config
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: buildall
      env:
        ASAN_OPTIONS: detect_leaks=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        set -ex
        cmake . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" -DVMIME_SENDMAIL_PATH:STRING="/usr/sbin/sendmail" -DVMIME_HAVE_TLS_SUPPORT:BOOL=ON -DVMIME_TLS_SUPPORT_LIB:STRING=gnutls -DVMIME_CHARSETCONV_LIB:STRING=icu -DVMIME_BUILD_TESTS=ON -DVMIME_BUILD_SAMPLES=OFF
        make "-j$(nproc)"
        ctest --output-on-failure

  build-cygwin:
    name: build-cygwin (openssl, iconv)
    runs-on: windows-latest
    steps:
    - name: git-config
      run: git config --global core.autocrlf input
    - name: install-deps
      uses: cygwin/cygwin-install-action@v6
      with:
        packages: cmake cppunit gcc-g++ libgsasl-devel libiconv-devel libssl-devel make pkg-config
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: buildall
      shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
      run: |
        set -x
        export PATH="/usr/bin:$(cygpath "${SYSTEMROOT}")/system32"
        cmake . -DVMIME_SENDMAIL_PATH:STRING="/usr/sbin/sendmail" -DVMIME_HAVE_TLS_SUPPORT:BOOL=ON -DVMIME_TLS_SUPPORT_LIB:STRING=openssl -DVMIME_CHARSETCONV_LIB:STRING=iconv -DVMIME_BUILD_TESTS=ON -DVMIME_BUILD_SAMPLES=ON
        make "-j$(nproc)"
        make install
        make test

  build-windows:
    name: build-windows (mingw, openssl, icu)
    runs-on: windows-latest
    steps:
    - name: git-config
      run: git config --global core.autocrlf input
    - name: install-deps
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: cmake:p cppunit:p gcc:p gsasl:p icu:p ninja:p openssl:p pkgconf:p
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: buildall
      shell: msys2 {0}
      run: |
        set -ex
        cmake . -G Ninja -DVMIME_HAVE_MESSAGING_PROTO_SENDMAIL:BOOL=OFF -DVMIME_HAVE_TLS_SUPPORT:BOOL=ON -DVMIME_TLS_SUPPORT_LIB:STRING=openssl -DVMIME_CHARSETCONV_LIB:STRING=icu -DVMIME_BUILD_TESTS=ON -DVMIME_BUILD_SAMPLES=ON
        cmake --build .
        ctest --output-on-failure

  book:
    name: book (pdf)
    runs-on: ubuntu-26.04
    steps:
    - name: install-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends librsvg2-bin make texlive-fonts-recommended texlive-latex-base texlive-latex-recommended
    - name: clone-vmime
      uses: actions/checkout@v4
    - name: build-book
      working-directory: doc/book
      run: make check
